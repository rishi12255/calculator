
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator | Rishi Malla</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 flex items-center justify-center p-4">

    <div class="w-full max-w-[260px] rounded-2xl bg-slate-900 p-4 shadow-2xl border border-slate-800">

        <h1 class="text-center text-lg font-bold text-white mb-4">
            Calculator
        </h1>

        <!-- Display -->
        <div class="bg-black rounded-xl p-4 mb-4 min-h-20 flex items-end justify-end overflow-hidden">
            <h2 id="display" class="text-white text-3xl font-light break-all text-right">
                0
            </h2>
        </div>

        <!-- Buttons -->
        <div class="grid grid-cols-4 gap-2">

            <button onclick="clearDisplay()" class="bg-red-500 hover:bg-red-600 text-white rounded-lg p-3 text-sm font-bold">C</button>
            <button onclick="deleteLast()" class="bg-slate-700 hover:bg-slate-600 text-white rounded-lg p-3 text-sm font-bold">DEL</button>
            <button onclick="appendToDisplay('/')" class="bg-orange-500 hover:bg-orange-600 text-white rounded-lg p-3 font-bold">/</button>
            <button onclick="appendToDisplay('*')" class="bg-orange-500 hover:bg-orange-600 text-white rounded-lg p-3 font-bold">×</button>

            <button onclick="appendToDisplay('7')" class="bg-slate-800 hover:bg-slate-700 text-white rounded-lg p-3">7</button>
            <button onclick="appendToDisplay('8')" class="bg-slate-800 hover:bg-slate-700 text-white rounded-lg p-3">8</button>
            <button onclick="appendToDisplay('9')" class="bg-slate-800 hover:bg-slate-700 text-white rounded-lg p-3">9</button>
            <button onclick="appendToDisplay('-')" class="bg-orange-500 hover:bg-orange-600 text-white rounded-lg p-3 font-bold">-</button>

            <button onclick="appendToDisplay('4')" class="bg-slate-800 hover:bg-slate-700 text-white rounded-lg p-3">4</button>
            <button onclick="appendToDisplay('5')" class="bg-slate-800 hover:bg-slate-700 text-white rounded-lg p-3">5</button>
            <button onclick="appendToDisplay('6')" class="bg-slate-800 hover:bg-slate-700 text-white rounded-lg p-3">6</button>
            <button onclick="appendToDisplay('+')" class="bg-orange-500 hover:bg-orange-600 text-white rounded-lg p-3 font-bold">+</button>

            <button onclick="appendToDisplay('1')" class="bg-slate-800 hover:bg-slate-700 text-white rounded-lg p-3">1</button>
            <button onclick="appendToDisplay('2')" class="bg-slate-800 hover:bg-slate-700 text-white rounded-lg p-3">2</button>
            <button onclick="appendToDisplay('3')" class="bg-slate-800 hover:bg-slate-700 text-white rounded-lg p-3">3</button>
            <button onclick="appendToDisplay('.')" class="bg-slate-800 hover:bg-slate-700 text-white rounded-lg p-3">.</button>

            <button onclick="appendToDisplay('0')" class="col-span-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg p-3">0</button>
            <button onclick="calculate()" class="col-span-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-lg p-3 font-bold">=</button>

        </div>

        <!-- Developer Credit -->
        <p class="text-center text-slate-400 text-[10px] mt-4">
            Developed by <span class="text-emerald-400 font-semibold">Rishi Malla</span>
        </p>

    </div>

    <script>
        const display = document.getElementById("display");
        let expression = "";

        function appendToDisplay(value) {
            if (display.innerText === "Error") {
                expression = "";
            }

            expression += value;
            display.innerText = expression || "0";
        }

        function clearDisplay() {
            expression = "";
            display.innerText = "0";
        }

        function deleteLast() {
            expression = expression.slice(0, -1);
            display.innerText = expression || "0";
        }

        function calculate() {
            try {
                if (!expression || !/^[0-9+\-*/.() ]+$/.test(expression)) return;

                const result = Function(
                    '"use strict"; return (' + expression + ')'
                )();

                if (!Number.isFinite(result)) throw new Error();

                expression = String(Number(result.toPrecision(12)));
                display.innerText = expression;
            } catch {
                expression = "";
                display.innerText = "Error";
            }
        }
    </script>

</body>
</html>
